context:
  version: "1.15.0"

package:
  name: kitops
  version: ${{ version }}

source:
  url: https://github.com/kitops-ml/kitops/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 956a3d526eb45848e66a49089fcc7867c7df4c2e019a3126219e8f1d7163f7e5

build:
  number: 0
  script:
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - let build_time = date now | format date '%Y-%m-%dT%H:%M:%SZ'
      - let short_commit_hash = (http get https://api.github.com/repos/kitops-ml/kitops/commits/v${{ version }}).sha | str substring 0..6
      - if: win
        then: let exe_name = 'kit.exe'
        else: let exe_name = 'kit'
      - ^go build
        -o ($prefix)/bin/($exe_name)
        -v
        -ldflags=$'-s -w -X github.com/kitops-ml/kitops/pkg/lib/constants.Version=${{ version }} -X github.com/kitops-ml/kitops/pkg/lib/constants.BuildTime=($build_time) -X github.com/kitops-ml/kitops/pkg/lib/constants.GitCommit=($short_commit_hash)'
        -trimpath
        .
      - ^go-licenses save . --save_path=library_licenses
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - ^kit completion bash | save ($prefix)/share/bash-completion/completions/kit
          - ^kit completion fish | save ($prefix)/share/fish/vendor_completions.d/kit.fish
          - ^kit completion zsh  | save ($prefix)/share/zsh/site-functions/_kit

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses
    - nushell

tests:
  - script:
      - kit --help
      - kit version
  - package_contents:
      bin:
        - kit
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/kit
            - share/fish/vendor_completions.d/kit.fish
            - share/zsh/site-functions/_kit
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/kit
            - Library/share/fish/vendor_completions.d/kit.fish
            - Library/share/zsh/site-functions/_kit
      strict: true

about:
  summary: An open source MLOps tool for packaging, versioning, and sharing AI/ML projects
  description: |
    KitOps is an open source tool that allows to package, version, share, and
    deploy AI/ML models and their associated artifacts using familiar DevOps
    practices and OCI standards. It facilitates collaborative work on
    self-hosted AI/ML models and makes sharing, automating, and deploying those
    models as simple as managing containerized apps.
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/
  homepage: https://kitops.org
  documentation: https://kitops.org/docs
  repository: https://github.com/kitops-ml/kitops

extra:
  recipe-maintainers:
    - salim-b
